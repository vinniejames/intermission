// Binds for the intermission pane. Loaded after id's default.cfg, which
// uses the arrow keys and binds "a" to look up rather than strafe.
m_freelook 1
lookspring 0
sensitivity 4
bind w +forward
bind a +moveleft
bind s +back
bind d +moveright
bind MOUSE1 +attack
bind 1 "impulse 1"
bind 2 "impulse 2"
bind 3 "impulse 3"
bind 4 "impulse 4"
bind 5 "impulse 5"
bind 6 "impulse 6"
bind 7 "impulse 7"
bind 8 "impulse 8"
