// The public intermission server: free-for-all deathmatch on the Quake
// shareware episode. Quake's own rules remove monsters in deathmatch, so an
// empty server is quiet until someone else is waiting too. The offline
// fallback (no server) is the shareware episode against monsters.

hostname "intermission"
deathmatch 1
coop 0
teamplay 0
skill 3
fraglimit 0
timelimit 10
pausable 0
sv_aim 0.93

map e1m1
