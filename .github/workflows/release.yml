# Builds the engine for each kind of Mac and attaches it to the GitHub release
# for the tag; the mod downloads the one it needs on first use. Tag a release
# as v<version>, matching plugin.json.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  engine:
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      PACKAGE: intermission-engine-macos-${{ matrix.arch }}.tar.gz
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches plugin.json
        run: test "v$(jq -r .version .claude-plugin/plugin.json)" = "$GITHUB_REF_NAME"

      - name: Install build tools
        run: brew install sdl2 dylibbundler p7zip

      - name: Get TyrQuake with our changes
        run: |
          git clone -q https://github.com/sezero/tyrquake.git tyrquake
          git -C tyrquake checkout -q "$(cat engine/tyrquake-commit)"
          git -C tyrquake apply "$GITHUB_WORKSPACE/engine/tyrquake.patch"

      # TyrQuake on Darwin compiles against SDL2.framework in /Library/Frameworks.
      # `brew install sdl2` is sdl2-compat, and #include "SDL.h" only sees
      # headers in that prefix's include/SDL2 directory.
      - name: Build
        run: |
          sdl_prefix="$(brew --prefix sdl2 2>/dev/null || true)"
          if [ ! -f "${sdl_prefix}/include/SDL2/SDL.h" ]; then
            sdl_prefix="$(brew --prefix sdl2-compat)"
          fi
          test -f "$sdl_prefix/include/SDL2/SDL.h"
          make -C tyrquake bin/tyr-quake USE_SDL=Y CD_TARGET=null -j3 \
            SDL_CFLAGS="-I${sdl_prefix}/include/SDL2" \
            SDL_LFLAGS="-L${sdl_prefix}/lib -lSDL2"

      # Copies the libraries into the app, so players need no Homebrew.
      # Homebrew's SDL2 is often sdl2-compat, which loads SDL3 at startup
      # rather than linking it, so put SDL3 beside it when it is installed.
      - name: Bundle libraries
        run: |
          app=package/tyr-quake.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/libs"
          cp tyrquake/bin/tyr-quake "$app/Contents/MacOS/tyr-quake"
          chmod u+w "$app/Contents/MacOS/tyr-quake"
          dylibbundler -od -b -x "$app/Contents/MacOS/tyr-quake" -d "$app/Contents/libs" \
            -p @executable_path/../libs/
          if [ -d "$(brew --prefix sdl3 2>/dev/null || true)" ] && [ -f "$(brew --prefix sdl3)/lib/libSDL3.0.dylib" ]; then
            cp "$(brew --prefix sdl3)/lib/libSDL3.0.dylib" "$app/Contents/libs/libSDL3.dylib"
            chmod u+w "$app/Contents/libs/libSDL3.dylib"
            install_name_tool -id @loader_path/libSDL3.dylib "$app/Contents/libs/libSDL3.dylib"
          fi
          codesign --force --sign - "$app"/Contents/libs/*.dylib
          cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>tyr-quake</string>
            <key>CFBundleIdentifier</key><string>com.vinniejames.intermission.tyrquake</string>
            <key>CFBundleName</key><string>intermission</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>15.0</string>
          </dict></plist>
          PLIST
          codesign --force --sign - "$app"

      - name: Package the shareware episode
        run: |
          mkdir -p package/id1 package/licenses
          sh engine/extract-pak0.sh package/id1
          cp client/intermission.cfg package/id1/intermission.cfg
          cp package/id1/slicnse.txt package/licenses/quake-shareware.txt
          cp package/id1/readme.txt package/licenses/quake-shareware-readme.txt
          rm -f package/id1/slicnse.txt package/id1/readme.txt package/id1/licinfo.txt
          cp tyrquake/gnu.txt package/licenses/tyrquake-gpl.txt
          cp tyrquake/readme-id.txt package/licenses/quake-engine.txt
          if [ -f "$(brew --prefix sdl2)/LICENSE.txt" ]; then
            cp "$(brew --prefix sdl2)/LICENSE.txt" package/licenses/sdl2.txt
          fi
          sdl2_prefix=$(brew --prefix sdl2-compat 2>/dev/null || true)
          if [ -n "$sdl2_prefix" ] && [ -f "$sdl2_prefix/LICENSE.txt" ]; then
            cp "$sdl2_prefix/LICENSE.txt" package/licenses/sdl2-compat.txt
          fi
          if [ -f "$(brew --prefix sdl3 2>/dev/null || echo /nonexistent)/LICENSE.txt" ]; then
            cp "$(brew --prefix sdl3)/LICENSE.txt" package/licenses/sdl3.txt
          fi
          cat > package/SOURCE.txt <<EOF
          This engine is TyrQuake at commit $(cat engine/tyrquake-commit) with the changes in
          https://github.com/vinniejames/intermission/blob/$GITHUB_REF_NAME/engine/tyrquake.patch applied.
          TyrQuake is at https://github.com/sezero/tyrquake (GPL-2.0).
          The game data is id Software's Quake 1.06 shareware pak0.pak only.
          Upstream of this mod is https://github.com/jarrodwatts/intermission.
          EOF

      - name: Check the packaged engine
        run: |
          codesign --verify --strict package/tyr-quake.app/Contents/libs/*.dylib package/tyr-quake.app
          printf '1 0\n' > input.txt
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            INTERMISSION_FRAMES=/imci- INTERMISSION_INPUT="$PWD/input.txt" \
            perl -e 'alarm 12; exec @ARGV' package/tyr-quake.app/Contents/MacOS/tyr-quake \
            -basedir "$PWD/package" -window -width 640 -height 360 +exec intermission.cfg +map e1m1 \
            > frames.log 2>&1 || true
          frames=$(grep -c '^@frame' frames.log || true)
          echo "drew $frames frames"
          test "$frames" -gt 10

      - name: Archive
        run: tar -czf "$PACKAGE" -C package .

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "" || true
          gh release upload "$GITHUB_REF_NAME" "$PACKAGE" --clobber
